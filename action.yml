name: Overture ruling check
description: Fail a pull request that breaks a ruling the owner locked in Overture, and say which and why.
author: overture
branding:
  icon: check-circle
  color: blue

# Use it on pull_request, after actions/checkout with fetch-depth: 0 (the base commit must be here):
#
#   permissions: {contents: read, pull-requests: write}
#   steps:
#     - uses: actions/checkout@v4
#       with: {fetch-depth: 0}
#     - uses: MikeHeid/overture@v1.37.0
#
# The rulings checked are the ones committed at the pull request's base, so the
# pull request cannot pass by editing or deleting a ruling file (rulecheck.py).

inputs:
  locked:
    description: Folder of committed ruling files. Default .overture.json fold.locked, else .overture/locked.
    required: false
    default: ""
  adapter:
    description: >-
      The project's adapter, imported to check item-status conditions. It is code from the pull
      request's checkout, so it runs (and reports item statuses) as the pull request wrote it. Opt in,
      with actions/checkout persist-credentials: false; no comment is posted when it is set.
    required: false
    default: ""
  strict:
    description: Fail when a ruling could not be checked (an item-status condition with no adapter).
    required: false
    default: "false"
  comment:
    description: >-
      Post one comment on the pull request when a ruling breaks, and keep it updated. Never with
      adapter, whose run holds no token; the job summary still has the report.
    required: false
    default: "true"
  github-token:
    description: Token for the comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: pass, fail or error
    value: ${{ steps.check.outputs.result }}

runs:
  using: composite
  steps:
    # Three steps, so the token is never in the environment of the step that runs the check: with
    # `adapter`, that step runs the pull request's own code (1.37.0, Sourcery on PR #162). Every value
    # reaches a script through the environment, never pasted into it: a branch name or input is data,
    # not shell (test_rulecheck.py checks this file for `${{` inside any run block).
    - id: check
      shell: bash
      env:
        KIT: ${{ github.action_path }}/plugin/kit
        BASE: ${{ github.event.pull_request.base.sha }}
        LOCKED: ${{ inputs.locked }}
        ADAPTER: ${{ inputs.adapter }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -u
        args=(--root "$GITHUB_WORKSPACE" --format markdown)
        if [ -n "$ADAPTER" ] && git -C "$GITHUB_WORKSPACE" config --get-regexp '^http\..*\.extraheader$' >/dev/null; then
          echo "::warning::the adapter is the pull request's code, and actions/checkout left this job's token in" \
               ".git/config; use persist-credentials: false with adapter"
        fi
        if [ -n "$BASE" ]; then
          git -C "$GITHUB_WORKSPACE" cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$BASE" \
            || echo "::warning::could not fetch the base commit; use actions/checkout with fetch-depth: 0"
          args+=(--base "$BASE")
        fi
        [ -n "$LOCKED" ] && args+=(--locked "$LOCKED")
        [ -n "$ADAPTER" ] && args+=(--adapter "$ADAPTER")
        [ "$STRICT" = true ] && args+=(--strict)
        report="$RUNNER_TEMP/overture-rulecheck.md"
        errors="$RUNNER_TEMP/overture-rulecheck.err"
        rc=0
        python3 "$KIT/rulecheck.py" "${args[@]}" >"$report" 2>"$errors" || rc=$?
        cat "$errors" >&2
        case $rc in 0) result=pass ;; 1) result=fail ;; *) result=error ;; esac
        { echo "result=$result"; echo "rc=$rc"; echo "report=$report"; } >>"$GITHUB_OUTPUT"
        if [ "$rc" -gt 1 ]; then
          # It could not run: say so where the old report stood, so a red comment is never left stale.
          { echo "<!-- overture-rulecheck -->"; echo "**Overture: the ruling check could not run.**"
            # The error can quote a ruling file's values; with no backtick left it cannot end the fence.
            echo; echo '````'; head -c 4000 "$errors" | tr '`' "'"; echo; echo '````'; } >"$report"
        fi
        cat "$report" >>"$GITHUB_STEP_SUMMARY"
        if [ -n "$ADAPTER" ]; then
          echo "::notice::no pull request comment with adapter: that run holds no token (see the job summary)"
        fi
    # One comment per pull request, found by the marker on its first line. It is posted when a ruling
    # breaks or a reviewer must look (a re-ruling, an edited ruling file, an unchecked one), then kept
    # up to date, so a fix turns it green rather than adding another. Never after an adapter ran: the
    # pull request's code could have written into this job's later steps (GITHUB_ENV).
    - id: comment
      if: inputs.comment == 'true' && inputs.adapter == '' && github.event.pull_request.number
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        RC: ${{ steps.check.outputs.rc }}
        REPORT: ${{ steps.check.outputs.report }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -u
        ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- overture-rulecheck -->"))) | .id') || ids=""
        id=${ids%%$'\n'*}
        post=false
        if [ "$RC" -eq 1 ] || grep -qF "<!-- overture-rulecheck: notable -->" "$REPORT"; then post=true; fi
        if [ -n "$id" ] && gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$REPORT" >/dev/null; then
          :
        elif [ -n "$id" ] || [ "$post" = true ]; then
          gh api "repos/$REPO/issues/$PR/comments" -F "body=@$REPORT" >/dev/null \
            || echo "::warning::could not post the ruling comment (does the token have pull-requests: write?)"
        fi
    - id: finish
      shell: bash
      env:
        RC: ${{ steps.check.outputs.rc }}
      run: |
        exit "${RC:-2}"
